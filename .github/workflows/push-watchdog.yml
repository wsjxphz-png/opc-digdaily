name: 推送通道看门狗

# 静默自愈：通道被禁用或当日推送失败时，在后台默默修好，全程不在群里发任何通知。
# 设计原则（2026-08-14 用户明确）：不要报警、不要补推通知、不要让人去手动修补——
# 用户只会在固定时间收到正常的每日推送，无需感知任何修复动作。
# 本工作流独立于 daily-push，每日在其后静默检查并自愈。
on:
  schedule:
    # 北京时间每天 07:00 = UTC 23:00。
    # 2026-08-29 从 13:30 挪到 23:00：8-26/27 GitHub 平台级 schedule 延迟后，
    # 主推送 run 可能延迟到 UTC 20-21 点才创建，看门狗若在其前检查会误判
    # 「今日无成功」而补推 → 与延迟到达的主推送双推。
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  actions: write   # 用于重新启用 / 触发 daily-push
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 读 storage/push_marker.json 需要仓库文件（每日推送成功后随 Persist state 提交）
      - uses: actions/checkout@v5

      - name: 检查并自愈推送通道
        env:
          WF: daily-push.yml
          REPO: ${{ github.repository }}
          FEISHU: ${{ secrets.FEISHU_WEBHOOK_URL }}
          # 2026-08-29 修复：gh CLI 在 Actions 里不自动继承 GITHUB_TOKEN，
          # 此前看门狗自 8-14 上线起每次运行都 exit 4（自愈机制从未生效）
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TODAY=$(date -u +%Y-%m-%d)

          STATE=$(gh api "repos/$REPO/actions/workflows/$WF" --jq '.state')
          echo "daily-push 当前状态: $STATE"

          # 1) 被禁用 -> 自动重开（静默自愈，不发任何通知）
          if [ "$STATE" = "disabled_manually" ] || [ "$STATE" = "disabled_inactivity" ]; then
            gh workflow enable "$WF" --repo "$REPO" || true
            echo "已自动重新启用"
          fi

          # 2) 今天是否已送达：优先读推送标记（main.py 推送成功后写入
          #    storage/push_marker.json，随 Persist state 提交回仓库）。
          #    标记比 run status 可靠——run 可能被超时 kill（status 非 success）
          #    但推送其实已成功，只看 status 会误补推造成双推。
          MARKER=storage/push_marker.json
          if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$TODAY" ]; then
            echo "今日已有成功推送标记，不补推"
            exit 0
          fi
          LAST_OK=$(gh run list --workflow "$WF" --repo "$REPO" --status success \
                      --limit 1 --json createdAt --jq '.[0].createdAt // ""' | cut -c1-10)
          PENDING=$(gh run list --workflow "$WF" --repo "$REPO" --limit 10 \
                      --json createdAt,status \
                      --jq "[.[] | select((.status==\"in_progress\") or (.status==\"queued\") or (.status==\"waiting\")) | select(.createdAt[0:10]==\"$TODAY\")] | length")
          echo "今日(UTC $TODAY) 最近成功: ${LAST_OK:-无}；今日进行中/排队: ${PENDING:-0}"

          if [ "$LAST_OK" != "$TODAY" ] && [ "${PENDING:-0}" = "0" ]; then
            echo "今日尚未成功推送，静默补推一次"
            gh workflow run "$WF" --repo "$REPO" || true
          fi

          # 3) 静默自愈：不在群里发任何通知（包括"恢复/补推"也不要）。
          #    正常日子这里什么都不会发生；只有通道被禁用或当日推送失败时，
          #    才在后台默默修好。用户只会在固定时间收到正常的每日推送，
          #    全程无需感知任何修复动作——这才是"每天固定自动推送"。
