name: 迭代通知（一次性，发完即删）

# 2026-09-03 临时通知：webhook 值在 secret 里本地不可读，
# 用一次性 workflow 在 runner 内发卡，用完删除本文件。勿复用。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 发飞书通知
        env:
          FEISHU: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          text = """【系统更新】AI机会雷达 × OPC 一人机会日报（9/3）

今天修了三个问题，两个系统都有份：

① 一天推两次的 bug
近期凌晨的自愈组件会误判"今天还没推送"，触发补推，导致一天收到两份日报。已改为按真实推送间隔判定，明日起恢复每天一次。

② 推送失败可能悄无声息
以前某次推送若发送失败，系统会显示"成功"也不会补推——丢了推送你都不知道。现在失败会自动触发次日补推，不再静默丢失。

③ 防并发 + 送达标记
两个系统补齐了并发互斥保护和推送成功标记，自愈链路统一。日常推送时间不变。"""
          payload = json.dumps({"msg_type": "text", "content": {"text": text}}).encode("utf-8")
          req = urllib.request.Request(os.environ["FEISHU"], data=payload,
                                       headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=15) as resp:
              body = resp.read().decode("utf-8")
              print("webhook响应:", body)
              assert '"code":0' in body or '"code": 0' in body, "发送失败: " + body
          EOF
