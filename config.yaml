# ============================================================
# 一人公司 (OPC) 赚钱机会挖掘 — 每日信息推送系统
# ============================================================
# 🎉 零成本方案：使用 WorkBuddy 内置定时任务 + AI，无需任何外部 API Key
#    你只需要填下面 1 项：
#      feishu.webhook_url  ← 飞书群机器人 webhook
#   已创建自动化任务，每天 9:00 自动执行。
# ============================================================
# 如果你也想用 Python 脚本独立运行（start.bat）：
#   还需填 ai.api_key (推荐 DeepSeek，¥0.02/天)
# ============================================================

# --- 飞书推送 ← 必填 ---
feishu:
  webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/你的TOKEN"
  card_color: "blue"

# --- AI 大模型 (仅 start.bat 独立运行时需要，自动化不需要) ---
ai:
  api_base: "https://apihub.agnes-ai.com/v1"
  api_key: "sk-你的API_KEY"
  model: "agnes-2.5-flash"
  max_tokens: 800
  temperature: 0.3

# --- 定时调度 ---
schedule:
  hour: 9
  minute: 0
  max_per_source: 5
  push_max: 8           # 每天最多推送 8 条

# ============================================================
# 关键词分为两级：
#   strong: 必须至少命中 1 个才能进入候选池（OPC 专属词）
