# ============================================================
# OPC 一人公司赚钱机会挖掘 — 每日信息推送系统
# ============================================================
# 用户画像：不会写代码，所有搭建由 AI（Cursor/Bolt/ChatGPT）代劳
# 推送标准：非程序员 + AI搭建 + 有实操过程 + 能复现
# ============================================================
# 零成本方案：使用 WorkBuddy 内置定时任务 + AI
#   你只需要填 feishu.webhook_url
#   已创建自动化任务，每天 9:00 自动执行
# ============================================================

# --- 飞书推送 ---
feishu:
  webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/6f30ced2-f0b9-4419-82bf-072d699cd926"
  card_color: "blue"

# --- AI 大模型 (仅 GitHub Actions 独立运行时需要) ---
ai:
  api_base: "https://apihub.agnes-ai.com/v1"
  api_key: "sk-你的API_KEY"
  model: "agnes-2.5-flash"
  max_tokens: 8000
  temperature: 0.3

# --- 定时调度 ---
schedule:
  hour: 9
  minute: 0
  max_per_source: 5
  push_max: 5

